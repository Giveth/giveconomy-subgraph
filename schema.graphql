type GIVPower @entity(immutable: false) {
  id: ID!
  initialDate: BigInt!
  locksCreated: Int!
  roundDuration: Int!
  totalGIVLocked: BigInt!
}

type TokenLock @entity(immutable: false) {
  id: ID!
  user: User!
  amount: BigInt!
  rounds: Int!
  untilRound: Int!
  unlockableAt: BigInt
  unlockedAt: BigInt
  unlocked: Boolean!
}

type User @entity(immutable: false) {
  id: ID!
  givLocked: BigInt!
  lastGivPowerUpdateTime: BigInt!
  locksOwned: [TokenLock!] @derivedFrom(field: "user")
  tokensBalance: [TokenBalance!] @derivedFrom(field: "user")
  unipoolsBalance: [UnipoolBalance!] @derivedFrom(field: "user")
  tokenDistroBalance: [TokenDistroBalance!] @derivedFrom(field: "user")
  giversPFPToken: [GiversPFPToken!] @derivedFrom(field: "user")
}

type UserGivPowerSnapshot @entity(immutable: false) {
    id: ID!
    timestamp: BigInt!
    user: User!
    givPowerAmount: BigInt!
    cumulativeGivPowerAmount: BigInt!
}

type TokenBalance @entity(immutable: false) {
  id: ID!
  balance: BigInt!
  user: User!
  token: String!
  updatedAt: BigInt!
}

type UnipoolBalance @entity(immutable: false) {
  id: ID!
  balance: BigInt!
  user: User!
  unipool: String!
  rewards: BigInt!
  rewardPerTokenPaid: BigInt!
  updatedAt: BigInt!
}

type BalanceChange @entity(immutable: false) {
  id: ID!
  account: String!
  contractAddress: String!
  time: BigInt!
  block: BigInt!
  amount: BigInt!
  newBalance: BigInt!
}

type Unipool @entity(immutable: false) {
  id: ID!
  periodFinish: BigInt
  totalSupply: BigInt!
  rewardRate: BigInt!
  lastUpdateTime: BigInt
  rewardPerTokenStored: BigInt!
}

type TokenDistroBalance @entity(immutable: false) {
  id: ID!
  user: User!
  allocatedTokens: BigInt!
  allocationCount: BigInt!
  claimed: BigInt!
  givback: BigInt!
  givDropClaimed: Boolean
  givbackLiquidPart: BigInt!
  tokenDistroAddress: String
}

type TokenAllocation @entity(immutable: false) {
  id: ID!
  recipient: String!
  amount: BigInt!
  timestamp: BigInt!
  txHash: String!
  distributor: String
  givback: Boolean
  praise: Boolean
  tokenDistroAddress: String!
}

type TransactionTokenAllocation @entity(immutable: false) {
  id: ID!
  tokenAllocationIds: [String!]!
}

type TokenDistro @entity(immutable: false) {
  id: ID!
  totalTokens: BigInt
  startTime: BigInt
  cliffTime: BigInt
  duration: BigInt
  initialAmount: BigInt
  lockedAmount: BigInt
}

type UniswapPosition @entity(immutable: false) {
    id: ID!
    tokenId: String!
    token0: String!
    token1: String!
    liquidity: BigInt!
    tickLower: Int!
    tickUpper: Int!
    tokenURI: String!
    owner: String!
    staker: String
    staked: Boolean
    closed: Boolean
}

type UniswapV3Pool @entity(immutable: false) {
    id: ID!
    token0: String!
    token1: String!
    sqrtPriceX96: BigInt!
    tick: BigInt!
    liquidity: BigInt!
}

type UniswapInfinitePosition @entity(immutable: false) {
    id: ID!
    lastUpdateTimeStamp: BigInt!
    lastRewardAmount: BigInt!
}

type GiversPFPToken @entity(immutable: false) {
    id: ID!
    tokenId: Int!
    user: User!
    imageIpfs: String!
    contractAddress: String!
}
